function wf(b){
  if(est.wifi_ativo==="false"){b.textContent="Adaptador de rede desativado.";return}
  b.append(el("p","","Redes disponíveis"));
  [["FUTUROS_ACADEMY",1,"▂▄▆█"],["NOX_5G",1,"▂▄"],["Visitante",0,"▂"]].forEach(([n,s,q])=>{
    const r=el("div","nw"),f=el("div","nf"),i=el("input"),bt=el("button","","Conectar"),m=el("div","err");
    r.textContent=q+" "+n+(s?" 🔒":"")+(wifi===n?" — conectado":"");f.style.display="none";i.type="password";i.placeholder="Senha";if(!s)i.style.display="none";
    r.onclick=()=>{f.style.display=f.style.display==="none"?"block":"none"};
    bt.onclick=async()=>{
      if(n==="NOX_5G"){m.textContent="Autenticação recusada. Esta rede não aceita você.";return}
      if(!s){wifi=n;wpass="";ls1("fc_wn",n);ls1("fc_wp","");m.textContent="Conectado (sem acesso à internet).";tb();return}
      m.textContent="conectando...";
      try{const x=await rpc("wifi_conectar",{p_senha:i.value});
        if(x.limite)m.textContent="Muitas tentativas. Aguarde um minuto.";
        else if(x.ok){wifi=n;wpass=i.value;ls1("fc_wn",n);ls1("fc_wp",i.value);m.textContent="Conectado.";tb()}
        else m.textContent="Senha incorreta.";
      }catch(e){m.textContent="Falha na conexão ["+e.message+"]"}};
    f.append(i,bt,m);b.append(r,f);});
  const dk=el("div","err");dk.style.cssText="margin-top:10px;color:#444;font-size:12px";b.append(dk);
  rpc("wifi_dicas").then(a=>{if(a&&a.length){dk.innerHTML="";dk.append(el("b","","Dicas sobre a senha:"));a.forEach(t=>{const p=el("div");p.textContent="• "+t;dk.append(p)})}}).catch(()=>{});}
function nav(b){
  b.innerHTML='<div class="ab"><input value="futuros.net"><button>Ir</button></div><div class="pg"></div>';
  const u=b.querySelector("input"),pg=b.querySelector(".pg"),msg=(t,s)=>{pg.innerHTML="";pg.append(el("b","",t),el("p","",s||""))};
  const off=()=>{wifi=null;wpass="";ls1("fc_wn","");ls1("fc_wp","");tb();msg("Conexão recusada","A senha da rede mudou. Reconecte-se.")};
  const loc=async q=>{pg.textContent="carregando...";try{const k=q.replace(/^nox\.net\/?/,"");let r;
    if(!k){r=await rpc("nox_listar",{p_senha:wpass});if(r.limite)return msg("Muitas tentativas","Aguarde um minuto.");if(!r.ok)return off();
      pg.innerHTML="";pg.append(el("h3","","NOX.NET — conversas interceptadas"));
      r.itens.forEach(i=>{const d=el("div","nw");d.textContent="💬 "+i.titulo;d.onclick=()=>{u.value="nox.net/"+i.chave;loc(u.value)};pg.append(d)});return}
    r=await rpc("nox_ler",{p_senha:wpass,p_chave:k});if(r.limite)return msg("Muitas tentativas","Aguarde um minuto.");if(!r.ok)return off();
    pg.innerHTML="";pg.append(el("h3","",""));pg.firstChild.textContent=r.titulo;
    r.texto.split("|").forEach(t=>{if(t==="[audio]"){if(r.audio_url){const au=el("audio");au.controls=true;au.src=r.audio_url;au.style.width="100%";pg.append(au)}else pg.append(el("p","","🔇 [áudio ainda indisponível — sem sinal]"))}else if(/^\[img:/.test(t)&&PH[t.slice(5,-1)]){const im=el("img");im.src=PH[t.slice(5,-1)];im.style.cssText="max-width:100%;border-radius:6px";pg.append(im)}else{const p=el("p");p.textContent=t;pg.append(p)}});
  }catch(e){msg("Falha de conexão","["+e.message+"]")}};
  if(wifi==="FUTUROS_ACADEMY")u.value="nox.net";
  const go=async()=>{
    if(!wifi)return msg("Sem conexão","ERR_INTERNET_DISCONNECTED. Conecte-se a uma rede Wi-Fi.");
    if(wifi==="Visitante")return msg("Sem internet","A rede Visitante não tem acesso à internet.");
    if(/^nox/i.test(u.value.trim()))return loc(u.value.trim().toLowerCase());
    pg.textContent="carregando...";
    try{const r=await rpc("navegador_pagina",{p_senha:wpass,p_url:u.value});
      if(r.limite)return msg("Muitas tentativas","Aguarde um minuto.");
      if(!r.ok)return msg("Página indisponível","Nenhum conteúdo neste endereço.")
      pg.innerHTML="";pg.append(el("h3","",""));pg.firstChild.textContent=r.titulo;r.texto.split("|").forEach(t=>{const p=el("p");p.textContent=t;pg.append(p)});
    }catch(e){msg("Falha de conexão","["+e.message+"]")}};
  b.querySelector("button").onclick=go;u.onkeydown=e=>{if(e.key==="Enter")go()};go();}
