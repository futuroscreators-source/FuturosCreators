<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Te levando para o site | Futuros Creators</title>
<style>
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: #2B0A57; color: #17101F; font-family: 'Nunito', system-ui, sans-serif; }
main { width: min(480px, 100%); padding: 32px 28px; text-align: center; background: #FFF6DD; border: 6px solid #17101F; border-radius: 26px; box-shadow: 10px 10px 0 #FF4FA3; }
h1 { margin: 0 0 10px; font: 400 clamp(1.7rem, 6vw, 2.3rem)/1.1 'Lilita One', 'Trebuchet MS', sans-serif; }
p { margin: 0 0 18px; font-size: 1.1rem; font-weight: 800; }
a { display: inline-block; padding: .55em 1.3em; background: #FF4FA3; color: #fff; border: 4px solid #17101F; border-radius: 999px; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<main>
    <h1>Opa, essa página não existe!</h1>
    <p>Estamos te levando para o lugar certo do site.</p>
    <a href="/">Ir para o início</a>
</main>
<script>
(function () {
    var l = location, p = l.pathname;
    function ir(u) { l.replace(u); }
    /* tira o .html e a barra final; se o resultado existir, vai para ele; senão, vai para o início */
    var limpo = p.replace(/(^|\/)index\.html$/i, '$1').replace(/\.html$/i, '').replace(/\/+$/, '');
    var cands = [];
    if (limpo) { cands.push(limpo); if (limpo.toLowerCase() !== limpo) cands.push(limpo.toLowerCase()); }
    var fim = setTimeout(function () { ir('/'); }, 5000);
    (function tenta(i) {
        if (i >= cands.length) { clearTimeout(fim); return ir('/'); }
        if (cands[i] === p) return tenta(i + 1);
        fetch(cands[i], { method: 'HEAD', cache: 'no-store' }).then(function (r) {
            if (r.ok) { clearTimeout(fim); ir(cands[i] + l.search + l.hash); } else tenta(i + 1);
        }).catch(function () { tenta(i + 1); });
    })(0);
})();
</script>
</body>
</html>
